# OrdoMail — configuration Supabase CLI
#
# verify_jwt = false sur secure-data : cette fonction reçoit ses propres jetons signés
# (voir supabase/functions/_shared/jwt.ts — jeton vendeur émis par verify-pin, jeton admin
# émis par verify-admin), pas des JWT Supabase Auth. Par défaut, la plateforme valide le
# header Authorization comme un JWT Supabase AVANT même d'exécuter le code de la fonction,
# ce qui rejetait ces jetons avec 401 sans jamais atteindre la vérification interne
# (verifyToken) — confirmé en test le 23/07/2026.
# La session titulaire (vraie session Supabase Auth) continue de fonctionner normalement :
# c'est un JWT Supabase valide, il passe la vérification native comme avant.
[functions.secure-data]
verify_jwt = false

# secure-data-admin (13/08/2026, extraite de secure-data) : mêmes jetons internes
# que ci-dessus (jeton admin émis par verify-admin) — même besoin de verify_jwt=false.
# Oubliée à la création de la fonction : sans cette entrée, la plateforme rejette
# le jeton admin en 401 "Invalid JWT" AVANT même que le code de la fonction ne
# s'exécute (repéré en test live juste après le premier déploiement).
[functions.secure-data-admin]
verify_jwt = false

# create-checkout-session est appelée juste après l'inscription (sb.auth.signUp +
# register-pharmacie), au même moment où la confirmation email peut être encore en
# attente — donc potentiellement sans session Supabase Auth active, comme
# register-pharmacie (déjà en verify_jwt=false). Explicité ici plutôt que de
# dépendre d'un défaut de plateforme non documenté dans ce repo.
[functions.create-checkout-session]
verify_jwt = false

# stripe-webhook est appelée par Stripe lui-même, qui n'envoie jamais de JWT
# Supabase — seulement un header stripe-signature vérifié par le code. Repéré
# le 24/07/2026 : cette fonction avait verify_jwt=true, ce qui aurait rejeté
# tous les webhooks Stripe avant même d'atteindre la vérification de signature.
[functions.stripe-webhook]
verify_jwt = false
